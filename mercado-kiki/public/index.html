<!DOCTYPE html>
<html lang="es-AR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gastos de a dos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1d22;--mut:#7b8190;--ln:#e8eaee;--A:#4f8cff;--B:#ff7a6b;--sh:0 4px 18px rgba(20,25,40,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1e2126;--tx:#eceef2;--mut:#9aa0ae;--ln:#2c3037;--sh:none}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1e2126;--tx:#eceef2;--mut:#9aa0ae;--ln:#2c3037;--sh:none}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Inter,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:18px 16px 130px}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:16px;margin:22px 0 10px}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.mut{color:var(--mut);font-size:13px}.big{font-size:30px;font-weight:700;letter-spacing:-.5px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.item:last-child{border:0}
.dot{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;flex:none;font-size:18px}
.grow{flex:1;min-width:0}.grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--ln);color:var(--mut);margin-left:6px;font-weight:600}
.btn{border:0;border-radius:18px;padding:12px 18px;font:inherit;font-weight:600;background:var(--tx);color:var(--bg);cursor:pointer}
.btn.s{background:var(--ln);color:var(--tx)}.btn.sm{padding:6px 12px;border-radius:14px;font-size:13px}.btn.r{background:#ffe3e0;color:#c0392b}
input,select,textarea{width:100%;border:1.5px solid var(--ln);border-radius:16px;padding:12px 14px;font:inherit;background:var(--card);color:var(--tx);margin:4px 0 12px}
label{font-size:12px;font-weight:600;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{border:1.5px solid var(--ln);background:var(--card);color:var(--tx);border-radius:99px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{border-color:var(--c,var(--tx));background:var(--c,var(--ln));color:#1b1d22;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:none;border:0;color:var(--mut);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 10px;border-radius:14px}
nav button span{font-size:20px}nav button.on{color:var(--tx);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--A);color:#fff;font-size:30px;box-shadow:0 8px 22px rgba(79,140,255,.45);z-index:6;cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:20px 18px 30px}
.bar{height:10px;border-radius:99px;background:var(--ln);overflow:hidden;display:flex}.bar i{display:block;height:100%}
.alert{background:#fff3cf;color:#6b5200;border-radius:18px;padding:12px 14px;margin-bottom:10px;font-size:14px}
.cols{display:flex;align-items:flex-end;gap:5px;height:130px;overflow-x:auto;padding-bottom:4px}
.col{flex:1;min-width:34px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;cursor:pointer;height:100%}
.col .st{width:100%;display:flex;flex-direction:column-reverse;border-radius:8px;overflow:hidden}.col small{font-size:10px;color:var(--mut)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:50;font-weight:600;opacity:0;transition:.25s;pointer-events:none}
#toast.on{opacity:1}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
</style></head><body>
<main id="app"></main><div id="toast"></div>
<script>
const CATS=[['Alquiler','#a9c8ff','🏠'],['Servicios','#ffe28a','💡'],['Supermercado','#a8e6a1','🛒'],['Entretenimiento','#cdb4f6','🎟️'],['Vacaciones','#ffc58a','🏖️'],['Transporte','#9fe0f5','🚌'],['Salud','#f7b2b2','💊'],['Hogar','#dcc3a3','🔧'],['Comida afuera','#f9b6d2','🍔'],['Mascotas','#8fe3d8','🐾'],['Otros','#cfd2d8','📦']];
const cat=n=>CATS.find(c=>c[0]===n)||CATS[10];
const PCOL={A:'#4f8cff',B:'#ff7a6b'};
let S={exp:[],settles:[],cfg:{names:{A:'Persona A',B:'Persona B'},cur:'ARS',cards:[{id:'c1',name:'Visa Galicia',owner:'shared',color:'#4f8cff',close:25,due:5}]}};
let me=null,tab='inicio',db=null,F={},selM=null,fMonth=null,q='';
try{me=localStorage.getItem('me')}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(+n||0).toLocaleString('es-AR',{style:'currency',currency:S.cfg.cur||'ARS'});
const nm=p=>S.cfg.names[p];
const ym=s=>{const d=typeof s==='string'?new Date(s+'T00:00'):s;return d.getFullYear()*12+d.getMonth()};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const ml=k=>new Date(Math.floor(k/12),k%12,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'});
const ms=k=>new Date(Math.floor(k/12),k%12,1).toLocaleDateString('es-AR',{month:'short'});
const CUR=ym(new Date());
const card=id=>S.cfg.cards.find(c=>c.id===id);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
function plan(e){const n=e.method==='credito'?+e.n||1:1;let f=ym(e.date);
 if(e.method==='credito'){const c=card(e.card);if(c){const d=new Date(e.date+'T00:00');const s=f+(d.getDate()>c.close?1:0);f=s+(c.due<=c.close?1:0)}}
 return Array.from({length:n},(_,i)=>({e,i,n,k:f+i,amt:e.q||e.total/n,paid:!!(e.paid||{})[i]}))}
const share=e=>e.split==='50'?.5:e.split==='pct'?(+e.pct||50)/100:e.split==='other'?0:1;
const all=()=>S.exp.flatMap(plan);
function balance(){let n=0;all().filter(c=>c.k<=CUR).forEach(c=>{const v=(1-share(c.e))*c.amt;n+=c.e.payer==='A'?v:-v});
 S.settles.forEach(s=>{n+=s.from==='A'?s.amt:-s.amt});return n}
/* ---------- datos ---------- */
let KEY='',pend=0,last='';try{KEY=localStorage.getItem('key')||''}catch(e){}
async function api(body){const r=await fetch('/api/data',{method:body?'POST':'GET',headers:{'content-type':'application/json','x-key':KEY},body:body?JSON.stringify(body):undefined});
 if(r.status===401){const k=prompt('Código de acceso');if(k===null)throw 0;KEY=k;try{localStorage.setItem('key',k)}catch(e){}return api(body)}
 if(!r.ok)throw new Error(r.status);return r.json()}
const W=b=>{pend++;return api(b).catch(()=>toast('No se pudo guardar')).finally(()=>pend--)};
function put(col,id,obj){const a=col==='expenses'?S.exp:S.settles;const i=a.findIndex(x=>x.id===id);const o={...obj,id};i<0?a.push(o):a[i]=o;render();W({op:'set',col,id,data:obj})}
function del(col,id){const k=col==='expenses'?'exp':'settles';S[k]=S[k].filter(x=>x.id!==id);render();W({op:'del',col,id})}
function saveCfg(){render();W({op:'set',col:'cfg',id:'main',data:S.cfg})}
async function load(){if(pend)return;try{const d=await api();const j=JSON.stringify(d);if(j===last)return;last=j;S.exp=d.expenses;S.settles=d.settles;if(d.cfg)S.cfg=d.cfg;render()}catch(e){}}
load();setInterval(()=>{if(!document.hidden)load()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});window.addEventListener('focus',load);
function seed(){const d=(o)=>{const x=new Date();x.setDate(x.getDate()-o);return iso(x)};
 const L=[{desc:'Alquiler',total:450000,cat:'Alquiler',date:d(8),payer:'A',split:'50',method:'transferencia'},
 {desc:'Supermercado',total:68500,cat:'Supermercado',date:d(3),payer:'B',split:'50',method:'debito'},
 {desc:'Entrada show',total:75000,cat:'Entretenimiento',date:d(11),payer:'A',split:'50',method:'credito',card:'c1',n:3,q:25000},
 {desc:'Heladera nueva',total:960000,cat:'Hogar',date:d(32),payer:'B',split:'50',method:'credito',card:'c1',n:12,q:80000,interest:true},
 {desc:'Cena afuera',total:32000,cat:'Comida afuera',date:d(1),payer:'B',split:'pct',pct:60,method:'efectivo'}];
 L.forEach((e,i)=>put('expenses','s'+i+Date.now().toString(36),{...e,by:e.payer,paid:{}}));toast('Datos de ejemplo cargados')}
/* ---------- vistas ---------- */
function items(list){return list.map(c=>{const e=c.e,k=cat(e.cat);return `<div class="item"><div class="dot" style="background:${k[1]}">${k[2]}</div><div class="grow"><b>${esc(e.desc)}${c.n>1?`<span class="tag">${c.i+1}/${c.n}</span>`:''}</b><span class="mut"><span style="color:${PCOL[e.payer]}">●</span> ${esc(nm(e.payer))} pagó · ${e.split==='own'?'personal':'su parte '+money(c.amt*share(e))}</span></div><div style="text-align:right"><b>${money(c.amt)}</b>${tab==='gastos'?`<div><button class="btn sm s" data-del="${e.id}">✕</button></div>`:''}</div></div>`}).join('')}
function vInicio(){const b=balance(),cs=all().filter(c=>c.k===CUR),g=cs.filter(c=>c.e.method!=='credito').reduce((s,c)=>s+c.amt,0),cu=cs.filter(c=>c.e.method==='credito').reduce((s,c)=>s+c.amt,0);
 let al='';S.cfg.cards.forEach(c=>{const t=cs.filter(x=>x.e.card===c.id&&!x.paid).reduce((s,x)=>s+x.amt,0);const dd=new Date(Math.floor(CUR/12),CUR%12,c.due);const dias=Math.ceil((dd-new Date().setHours(0,0,0,0))/864e5);if(t>0&&dias>=0&&dias<=5)al+=`<div class="alert">💳 ${esc(c.name)} vence en ${dias} día${dias==1?'':'s'}: ${money(t)}</div>`});
 all().filter(c=>c.n>1&&c.i===c.n-2&&c.k<=CUR+0&&false);
 S.exp.forEach(e=>{const p=plan(e);if(p.length>1){const rest=p.filter(c=>c.k>=CUR).length;if(rest===1&&p[p.length-1].k>=CUR)al+=`<div class="alert">🎉 Te queda 1 cuota de ${esc(e.desc)}</div>`}});
 const who=b>0.5?`${nm('B')} le debe ${money(b)} a ${nm('A')}`:b<-0.5?`${nm('A')} le debe ${money(-b)} a ${nm('B')}`:'Están a mano 🎉';
 const last=all().filter(c=>c.k<=CUR).sort((a,b)=>b.e.date.localeCompare(a.e.date)).slice(0,5);
 return `<h1>Hola, ${esc(nm(me))} 👋</h1>${al}<div class="card" style="background:linear-gradient(135deg,var(--A),#8e7bff);color:#fff"><div class="mut" style="color:#e6ecff">Balance</div><div class="big" style="font-size:24px">${who}</div>${Math.abs(b)>.5?'<button class="btn sm" style="margin-top:12px;background:#fff;color:#333" data-act="settle">Saldar cuentas</button>':''}</div>
 <div class="card"><div class="mut">${ml(CUR)}</div><div class="big">${money(g+cu)}</div><div class="row mut"><span>Gastos ${money(g)}</span><span>Cuotas ${money(cu)}</span></div></div>
 <h2>Últimos gastos</h2><div class="card">${last.length?items(last):`<div class="empty">Todavía no hay gastos.<br>Tocá el <b>+</b> para cargar el primero.${db||1?'<br><br><button class="btn s" data-act="seed">Cargar datos de ejemplo</button>':''}</div>`}</div>`}
function vGastos(){const k=fMonth??CUR;let ks=[...new Set(all().map(c=>c.k).concat(CUR))].sort((a,b)=>b-a);
 let l=all().filter(c=>c.k===k&&(!q||c.e.desc.toLowerCase().includes(q.toLowerCase()))).sort((a,b)=>b.e.date.localeCompare(a.e.date));
 const g={};l.forEach(c=>(g[c.e.date]??=[]).push(c));
 return `<h1>Gastos</h1><select id="fm">${ks.map(x=>`<option value="${x}" ${x===k?'selected':''}>${ml(x)}</option>`).join('')}</select><input id="q" placeholder="Buscar por descripción…" value="${esc(q)}">
 ${l.length?Object.keys(g).map(d=>`<div class="mut" style="margin:8px 4px">${new Date(d+'T00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}</div><div class="card">${items(g[d])}</div>`).join(''):'<div class="empty">No hay gastos para mostrar.</div>'}`}
function vCuotas(){const cs=all().filter(c=>c.e.method==='credito'),mes=cs.filter(c=>c.k===CUR);
 let h='<h1>Tarjetas y cuotas</h1><h2>Este mes</h2>';
 h+=S.cfg.cards.map(c=>{const l=mes.filter(x=>x.e.card===c.id),t=l.reduce((s,x)=>s+x.amt,0);const dd=new Date(Math.floor(CUR/12),CUR%12,c.due);const dias=Math.ceil((dd-new Date().setHours(0,0,0,0))/864e5);
  return `<div class="card"><div class="row"><b style="color:${c.color}">● ${esc(c.name)}</b><b>${money(t)}</b></div><div class="mut">Vence el ${c.due} · ${dias>=0?`faltan ${dias} días`:'vencido'}</div>${l.map(x=>`<div class="item"><div class="grow"><b>${esc(x.e.desc)} · cuota ${x.i+1}/${x.n}</b></div><span>${money(x.amt)}</span><button class="btn sm ${x.paid?'':'s'}" data-paid="${x.e.id}|${x.i}">${x.paid?'Pagada ✓':'Pagar'}</button></div>`).join('')||'<div class="mut" style="margin-top:6px">Sin cuotas este mes</div>'}</div>`}).join('');
 const ks=Array.from({length:12},(_,i)=>CUR+i),tot=ks.map(k=>cs.filter(c=>c.k===k).reduce((s,c)=>s+c.amt,0)),mx=Math.max(...tot,1);
 h+=`<h2>Próximos 12 meses</h2><div class="card"><div class="cols">${ks.map((k,i)=>`<div class="col" data-m="${k}"><small>${tot[i]?Math.round(tot[i]/1000)+'k':''}</small><div class="st" style="height:${tot[i]/mx*90}px;${k===selM?'outline:2px solid var(--tx)':''}">${S.cfg.cards.map(c=>{const v=cs.filter(x=>x.k===k&&x.e.card===c.id).reduce((s,x)=>s+x.amt,0);return `<i style="background:${c.color};height:${v/Math.max(tot[i],1)*100}%"></i>`}).join('')}</div><small>${ms(k)}</small></div>`).join('')}</div>
 ${selM!=null?`<div class="mut" style="margin:10px 0 0">${ml(selM)}</div>`+cs.filter(c=>c.k===selM).map(x=>`<div class="item"><div class="grow"><b>${esc(x.e.desc)} ${x.i+1}/${x.n}</b></div>${money(x.amt)}</div>`).join(''):'<div class="mut" style="margin-top:8px">Tocá un mes para ver el detalle</div>'}</div>`;
 const act=S.exp.map(e=>({e,p:plan(e)})).filter(x=>x.e.method==='credito'&&x.p.some(c=>c.k>=CUR));
 h+='<h2>Compras en curso</h2>';
 h+=act.map(({e,p})=>{const done=p.filter(c=>c.k<CUR||c.paid).length,rest=p.filter(c=>!(c.k<CUR||c.paid));return `<div class="card"><div class="row"><b>${esc(e.desc)}</b><button class="btn sm r" data-cancel="${e.id}">Cancelar</button></div><div class="bar" style="margin:8px 0"><i style="width:${done/p.length*100}%;background:#6fcf97"></i></div><div class="mut">${done} de ${p.length} pagadas · cuota ${money(p[0].amt)}${e.interest?' · con interés':''}<br>Pendiente ${money(rest.reduce((s,c)=>s+c.amt,0))} · última en ${ml(p[p.length-1].k)}</div></div>`}).join('')||'<div class="empty">No hay compras en cuotas.</div>';
 const pend=cs.filter(c=>!(c.k<CUR||c.paid));
 h+=`<h2>Totales pendientes</h2><div class="card"><div class="row"><b>Deuda total en cuotas</b><b>${money(pend.reduce((s,c)=>s+c.amt,0))}</b></div>${S.cfg.cards.map(c=>`<div class="row mut"><span>${esc(c.name)}</span><span>${money(pend.filter(x=>x.e.card===c.id).reduce((s,x)=>s+x.amt,0))}</span></div>`).join('')}<hr style="border:0;border-top:1px solid var(--ln)">${['A','B'].map(p=>`<div class="row mut"><span style="color:${PCOL[p]}">● Pagó ${esc(nm(p))}</span><span>${money(pend.filter(x=>x.e.payer===p).reduce((s,x)=>s+x.amt,0))}</span></div>`).join('')}</div>`;return h}
function vResumen(){const cs=all(),m=cs.filter(c=>c.k===CUR),pv=cs.filter(c=>c.k===CUR-1).reduce((s,c)=>s+c.amt,0),t=m.reduce((s,c)=>s+c.amt,0);
 const by=CATS.map(c=>[c,m.filter(x=>x.e.cat===c[0]).reduce((s,x)=>s+x.amt,0)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
 return `<h1>Resumen</h1><div class="card"><div class="mut">${ml(CUR)}</div><div class="big">${money(t)}</div><div class="mut">Mes anterior ${money(pv)} ${pv?`(${t>=pv?'+':''}${Math.round((t/pv-1)*100)}%)`:''}<br>De cuotas: ${money(m.filter(c=>c.e.method==='credito').reduce((s,c)=>s+c.amt,0))}</div></div>
 <div class="card"><b>Por categoría</b>${by.map(([c,v])=>`<div style="margin-top:12px"><div class="row"><span>${c[2]} ${c[0]}</span><b>${money(v)}</b></div><div class="bar"><i style="width:${v/t*100}%;background:${c[1]}"></i></div></div>`).join('')||'<div class="empty">Sin datos este mes</div>'}</div>
 <div class="card"><b>Quién pagó</b>${['A','B'].map(p=>`<div class="row" style="margin-top:8px"><span style="color:${PCOL[p]}">● ${esc(nm(p))}</span><b>${money(m.filter(x=>x.e.payer===p).reduce((s,x)=>s+x.amt,0))}</b></div>`).join('')}</div>`}
function vAjustes(){return `<h1>Ajustes</h1><div class="card"><label>Nombre Persona A</label><input id="nA" value="${esc(nm('A'))}"><label>Nombre Persona B</label><input id="nB" value="${esc(nm('B'))}"><label>Moneda</label><select id="cur">${['ARS','USD','EUR','UYU'].map(c=>`<option ${c===S.cfg.cur?'selected':''}>${c}</option>`).join('')}</select><button class="btn" data-act="names">Guardar</button></div>
 <h2>Tarjetas</h2>${S.cfg.cards.map(c=>`<div class="card row"><span><b style="color:${c.color}">● ${esc(c.name)}</b><br><span class="mut">${c.owner==='shared'?'Compartida':esc(nm(c.owner))} · cierra ${c.close} · vence ${c.due}</span></span><button class="btn sm r" data-delcard="${c.id}">✕</button></div>`).join('')}
 <div class="card"><label>Nueva tarjeta</label><input id="cn" placeholder="Ej: Mastercard Santander"><select id="co"><option value="shared">Compartida</option><option value="A">${esc(nm('A'))}</option><option value="B">${esc(nm('B'))}</option></select><div class="row"><div><label>Día de cierre</label><input id="cc" type="number" min="1" max="31" value="25"></div><div><label>Día de vencimiento</label><input id="cd" type="number" min="1" max="31" value="5"></div></div><label>Color</label><input id="ccol" type="color" value="#ff7a6b" style="height:44px"><button class="btn" data-act="addcard">Agregar tarjeta</button></div>
 <div class="card"><button class="btn s" data-act="csv">Exportar a CSV</button> <button class="btn s" data-act="who">Cambiar de perfil</button></div>`}
function render(){const a=$('#app');if(!me){a.innerHTML=`<div style="padding-top:12vh"><h1 style="font-size:28px">Gastos de a dos 💸</h1><p class="mut">¿Quién sos?</p>${['A','B'].map(p=>`<div class="card" data-me="${p}" style="cursor:pointer;border:2px solid ${PCOL[p]}"><b style="font-size:18px">${esc(nm(p))}</b></div>`).join('')}</div>`;return}
 const T=[['inicio','🏠','Inicio'],['gastos','🧾','Gastos'],['cuotas','💳','Cuotas'],['resumen','📊','Resumen'],['ajustes','⚙️','Ajustes']];
 const keep=document.activeElement&&document.activeElement.id==='q';
 a.innerHTML=({inicio:vInicio,gastos:vGastos,cuotas:vCuotas,resumen:vResumen,ajustes:vAjustes})[tab]()+`<nav>${T.map(t=>`<button class="${t[0]===tab?'on':''}" data-tab="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav><button class="fab" data-act="add">+</button>`;
 if(keep){const i=$('#q');i.focus();i.setSelectionRange(99,99)}}
/* ---------- formulario ---------- */
const chips=(g,o)=>`<div class="chips">${o.map(([v,t,c])=>`<button type="button" class="chip" data-g="${g}" data-v="${v}" ${c?`style="--c:${c}"`:''}>${t}</button>`).join('')}</div>`;
function openForm(){F={cat:'Supermercado',method:'debito',split:'50',payer:me,n:3};const s=document.createElement('div');s.className='sheet';s.id='sheet';
 s.innerHTML=`<div><h1>Nuevo gasto</h1><label>Monto total</label><input id="f_total" type="number" inputmode="decimal" placeholder="0,00"><label>Descripción</label><input id="f_desc" placeholder="Ej: Cena con amigos"><label>Categoría</label>${chips('cat',CATS.map(c=>[c[0],c[2]+' '+c[0],c[1]]))}<label>Fecha</label><input id="f_date" type="date" value="${iso(new Date())}"><label>Quién pagó</label>${chips('payer',[['A',esc(nm('A')),PCOL.A],['B',esc(nm('B')),PCOL.B]])}<label>Cómo se divide</label>${chips('split',[['50','50/50'],['pct','Porcentaje'],['other','Lo debe todo el otro'],['own','Personal']])}<div id="pctb" hidden><label>% que le corresponde a quien pagó</label><input id="f_pct" type="number" value="50" min="0" max="100"></div><label>Medio de pago</label>${chips('method',[['efectivo','Efectivo'],['debito','Débito'],['transferencia','Transferencia'],['credito','Tarjeta de crédito']])}
 <div id="cb" hidden><label>Tarjeta</label><select id="f_card">${S.cfg.cards.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><label>Cuotas</label>${chips('n',[1,3,6,12,18,24].map(n=>[n,n]))}<input id="f_n" type="number" min="1" value="3"><label><input id="f_int" type="checkbox" style="width:auto;margin:0 6px 0 0"> Con interés</label><div id="qb" hidden><label>Valor de la cuota (calcula el total financiado)</label><input id="f_q" type="number" inputmode="decimal"></div><div class="card" id="prev" style="background:var(--ln);box-shadow:none"></div></div>
 <label>Nota (opcional)</label><input id="f_note"><div class="row"><button class="btn s" data-act="close">Cancelar</button><button class="btn" data-act="save" style="flex:1">Guardar gasto</button></div></div>`;
 document.body.appendChild(s);upd()}
function calc(){const total=+$('#f_total').value||0,n=Math.max(1,+$('#f_n').value||1),i=$('#f_int').checked,qv=+$('#f_q').value||0;const q=i&&qv?qv:total/n;return{n,q,total:i&&qv?qv*n:total}}
function upd(){document.querySelectorAll('#sheet .chip').forEach(b=>{const on=String(F[b.dataset.g])===b.dataset.v;b.classList.toggle('on',on)});
 $('#pctb').hidden=F.split!=='pct';const cr=F.method==='credito';$('#cb').hidden=!cr;$('#qb').hidden=!$('#f_int').checked;
 if(cr){const c=calc(),pl=plan({date:$('#f_date').value||iso(new Date()),method:'credito',card:$('#f_card').value,n:c.n,q:c.q,total:c.total});$('#prev').innerHTML=`<b>${c.n} cuota${c.n>1?'s':''} de ${money(c.q)}</b><br><span class="mut">primera en ${ml(pl[0].k)} · última en ${ml(pl[pl.length-1].k)}${c.total?` · total ${money(c.total)}`:''}</span>`}}
function save(){const d=$('#f_desc').value.trim(),c=calc();if(!(+$('#f_total').value>0))return toast('Ingresá un monto');if(!d)return toast('Falta la descripción');
 const e={desc:d,total:c.total,cat:F.cat,date:$('#f_date').value,payer:F.payer,split:F.split,pct:+$('#f_pct').value,method:F.method,note:$('#f_note').value,by:me,paid:{}};
 if(F.method==='credito'){Object.assign(e,{card:$('#f_card').value,n:c.n,q:c.q,interest:$('#f_int').checked})}else e.q=c.total;
 put('expenses','e'+Date.now().toString(36),e);$('#sheet').remove();toast('Gasto agregado')}
/* ---------- eventos ---------- */
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-me],[data-tab],[data-act],[data-g],[data-del],[data-paid],[data-m],[data-cancel],[data-delcard]');if(!t)return;const D=t.dataset;
 if(D.me){me=D.me;try{localStorage.setItem('me',me)}catch(e){}return render()}
 if(D.tab){tab=D.tab;return render()}
 if(D.g){F[D.g]=D.v;if(D.g==='n')$('#f_n').value=D.v;return upd()}
 if(D.m){selM=selM==+D.m?null:+D.m;return render()}
 if(D.del&&confirm('¿Eliminar este gasto?')){del('expenses',D.del);toast('Gasto eliminado')}
 if(D.cancel&&confirm('¿Cancelar esta compra en cuotas?')){del('expenses',D.cancel);toast('Compra cancelada')}
 if(D.paid){const[id,i]=D.paid.split('|'),e=S.exp.find(x=>x.id===id);const p={...(e.paid||{})};p[i]=!p[i];const o={...e,paid:p};delete o.id;put('expenses',id,o)}
 if(D.delcard&&confirm('¿Borrar la tarjeta?')){S.cfg.cards=S.cfg.cards.filter(c=>c.id!==D.delcard);saveCfg()}
 switch(D.act){case'add':openForm();break;case'close':$('#sheet').remove();break;case'save':save();break;case'seed':seed();break;case'who':me=null;try{localStorage.removeItem('me')}catch(e){}render();break;
 case'settle':{const b=balance();if(confirm(`Registrar el pago de ${money(Math.abs(b))} y dejar el balance en cero?`)){put('settles','s'+Date.now().toString(36),{from:b>0?'B':'A',to:b>0?'A':'B',amt:Math.abs(b),date:iso(new Date()),by:me});toast('Cuentas saldadas')}break}
 case'names':S.cfg.names={A:$('#nA').value||'Persona A',B:$('#nB').value||'Persona B'};S.cfg.cur=$('#cur').value;saveCfg();toast('Guardado');break;
 case'addcard':{const n=$('#cn').value.trim();if(!n)return toast('Poné un nombre');S.cfg.cards=[...S.cfg.cards,{id:'c'+Date.now().toString(36),name:n,owner:$('#co').value,color:$('#ccol').value,close:+$('#cc').value||25,due:+$('#cd').value||5}];saveCfg();toast('Tarjeta agregada');break}
 case'csv':{const r=[['Fecha','Descripción','Categoría','Pagó','Medio','Cuota','Monto']].concat(all().map(c=>[c.e.date,c.e.desc,c.e.cat,nm(c.e.payer),c.e.method,`${c.i+1}/${c.n}`,c.amt]));const txt=r.map(x=>x.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');const u=URL.createObjectURL(new Blob(['\ufeff'+txt],{type:'text/csv'}));const l=document.createElement('a');l.href=u;l.download='gastos.csv';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000);break}}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='q'){q=t.value;render()}else if(t.closest&&t.closest('#sheet'))upd()});
document.addEventListener('change',ev=>{if(ev.target.id==='fm'){fMonth=+ev.target.value;render()}else if(ev.target.closest('#sheet'))upd()});
</script></body></html>
